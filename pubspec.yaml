name: inventario_app
description: "Sistema de inventario escolar"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  community_charts_flutter: ^1.0.4
  mobile_scanner: 7.4.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  open_file: ^3.3.2
  intl: ^0.19.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/inventario.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/inventario.png"
  min_sdk_android: 21